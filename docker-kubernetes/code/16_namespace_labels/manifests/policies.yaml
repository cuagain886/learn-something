apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: lab-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 20m
        memory: 16Mi
      default:
        cpu: 200m
        memory: 64Mi
      min:
        cpu: 5m
        memory: 8Mi
      max:
        cpu: "1"
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: lab-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "10"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: lab-prod
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "1"
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: lab-prod
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "20"
    configmaps: "20"
