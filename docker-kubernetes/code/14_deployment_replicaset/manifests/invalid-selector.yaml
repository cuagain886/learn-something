apiVersion: apps/v1
kind: Deployment
metadata:
  name: invalid-selector-demo
  namespace: dk-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selector-value
  template:
    metadata:
      labels:
        app: different-template-value
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
