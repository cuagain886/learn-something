apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-object-demo
  namespace: dk-course
  labels:
    app.kubernetes.io/name: api-object-demo
    app.kubernetes.io/managed-by: course-manager-a
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-object-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-object-demo
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
