apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: dk-course
  labels:
    app.kubernetes.io/name: network-client
spec:
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: alpine:3.22
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "trap 'exit 0' TERM INT; sleep 86400 & wait"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
